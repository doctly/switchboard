name: Release (Mac)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle assets
        run: npm run bundle:codemirror && npm run bundle:vue

      - name: Build Mac app
        run: npx electron-builder --mac --publish never --config.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts to GitHub Release
        run: gh release upload "${{ github.ref_name }}" dist/Switchboard-*-arm64.dmg dist/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
