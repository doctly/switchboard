<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wooton Pad</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Single Vue app mount point — App.vue renders the full layout -->
  <div id="app-container"></div>

  <!-- Outside-container elements that Vue Teleports into -->
  <div id="update-toast" class="hidden">
    <span id="update-toast-msg">Update ready — restart to apply</span>
    <button id="update-restart-btn">Restart</button>
    <button id="update-dismiss-btn">Later</button>
  </div>
  <div id="status-bar"></div>
  <div id="vue-grid-cards"></div>
  <div id="app-tooltip"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-unicode-graphemes/lib/addon-unicode-graphemes.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="codemirror-bundle.js"></script>
  <script src="icons.js"></script>
  <script src="terminal-fonts.js"></script>
  <script src="vue-bundle.js"></script>
  <script src="file-panel.js"></script>
  <script src="utils.js"></script>
  <script src="terminal-themes.js"></script>
  <script src="terminal-manager.js"></script>
  <script src="grid-view.js"></script>
  <script src="dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
